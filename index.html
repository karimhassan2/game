  addEventListener("keydown",function(e){if(e.code==="KeyE")interact();if(e.code==="Escape")closeM();});
  $("ti").onclick=interact;run=true;loop();
}catch(e){L("❌ start() error: "+(e&&e.message));}}
var firstFrame=true;
function loop(){try{if(!run)return;requestAnimationFrame(loop);
  if(firstFrame){firstFrame=false;L("8/8 ✅ RENDERING — GAME IS RUNNING! 🎮");}
  var dt=Math.min(clock.getDelta(),.05);upP(dt);var t=performance.now()*.001;
  ng.userData.core.rotation.y+=dt*1.2;ng.userData.ring.rotation.z+=dt*.8;ng.userData.core.position.y=2.4+Math.sin(t*2)*.15;
  var d=Math.hypot(P.pos.x-NODE.pos.x,P.pos.z-NODE.pos.z);if(d<7&&!near){near=true;if(!solved)toast("✨ اضغط E لدخول المعمل");}else if(d>=7)near=false;
  renderer.render(scene,camera);
}catch(e){run=false;L("❌ loop() error: "+(e&&e.message));}}

var sb=document.getElementById("startBtn");
sb.disabled=false;sb.textContent="▶ Start / ابدأ";sb.onclick=start;
