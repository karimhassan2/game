<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>Cyber Range — BAC Lab</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#0a0e1a;color:#e6ecff;font-family:'Segoe UI',system-ui,sans-serif;-webkit-user-select:none;user-select:none}
canvas{position:fixed;inset:0;width:100vw;height:100vh;display:block;touch-action:none}
#err{display:none;position:fixed;top:0;left:0;right:0;z-index:999;background:#7a0016;color:#fff;padding:12px;font:13px monospace;white-space:pre-wrap}
.ov{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 30%,#16213e,#070a14);padding:16px;overflow:auto}
.card{background:#121a2e;border:1px solid #243252;border-radius:18px;padding:26px;max-width:500px;width:100%}
.logo{font-size:30px;font-weight:800;color:#2ee6a6;text-align:center}
.sub{text-align:center;color:#4da6ff;margin:6px 0 14px;font-weight:600}
input{width:100%;background:#0b1120;border:1px solid #243252;border-radius:10px;padding:12px;color:#e6ecff;font-size:16px;outline:none;margin:6px 0 14px}
.bp{width:100%;background:linear-gradient(90deg,#2ee6a6,#1fd0e0);color:#04121a;border:none;border-radius:12px;padding:15px;font-size:17px;font-weight:800;cursor:pointer}
.bp:disabled{background:#33415e;color:#8ea0c8;cursor:wait}
.how{margin-top:16px;background:#0b1120;border:1px solid #243252;border-radius:12px;padding:14px;font-size:12.5px;color:#8ea0c8;line-height:1.7}
.how b{color:#e6ecff}
.hud{position:fixed;inset:0;z-index:20;pointer-events:none}
.top{position:absolute;top:12px;left:12px;right:12px;display:flex;gap:12px;align-items:center}
.bg{background:#121a2e;border:1px solid #ffd166;color:#ffd166;padding:6px 12px;border-radius:20px;font-weight:700;font-size:13px}
.ob{flex:1;font-size:13px;color:#8ea0c8}
.fl{background:#121a2e;border:1px solid #243252;padding:6px 12px;border-radius:20px;font-weight:700}
.tst{position:absolute;bottom:120px;left:50%;transform:translateX(-50%);background:rgba(46,230,166,.15);border:1px solid #2ee6a6;color:#2ee6a6;padding:11px 20px;border-radius:12px;font-weight:700;font-size:14px}
.tst.bad{background:rgba(255,84,112,.15);border-color:#ff5470;color:#ff5470}
.tc{position:fixed;inset:0;z-index:15;pointer-events:none}
.joy{position:absolute;bottom:40px;left:40px;width:120px;height:120px;border-radius:50%;background:rgba(18,26,46,.5);border:2px solid #243252;pointer-events:auto}
.kn{position:absolute;top:50%;left:50%;width:52px;height:52px;border-radius:50%;background:rgba(46,230,166,.5);border:2px solid #2ee6a6;transform:translate(-50%,-50%)}
.ti{position:absolute;bottom:56px;right:40px;width:78px;height:78px;border-radius:50%;background:rgba(77,166,255,.25);border:2px solid #4da6ff;color:#fff;font-size:24px;font-weight:800;pointer-events:auto}
.mr{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;background:rgba(4,8,16,.75);padding:16px;overflow:auto}
.md{background:#121a2e;border:1px solid #243252;border-radius:16px;padding:22px;max-width:720px;width:100%}
.md h2{color:#2ee6a6;font-size:20px;margin-bottom:4px}
.ar{direction:rtl;color:#4da6ff;font-size:15px;margin-bottom:12px;font-weight:600}
.by{font-size:14px;line-height:1.7;margin-bottom:8px}.by.ar{color:#8ea0c8}
.act{display:flex;gap:10px;margin-top:14px}
.act button{flex:1;padding:12px;border-radius:10px;border:none;font-weight:700;cursor:pointer;font-size:14px}
.go{background:#2ee6a6;color:#04121a}.gh{background:#1a2540;color:#e6ecff;border:1px solid #243252}
.fbk{margin-top:10px;padding:12px;border-radius:10px;font-size:13.5px;line-height:1.6;background:rgba(46,230,166,.1);border:1px solid #2ee6a6;color:#2ee6a6}
code{background:#04121a;padding:1px 5px;border-radius:4px;color:#ffd166;font-size:12px}
</style>
<script>
window.onerror=function(m,s,l){showErr(m+" @ line "+l);};
function showErr(m){var d=document.getElementById("err");if(d){d.style.display="block";d.textContent="⚠️ "+m;}}
</script>
</head><body>
<div id="err"></div>
<div id="boot" class="ov"><div class="card">
  <div class="logo">🛡️ CYBER RANGE</div>
  <div class="sub">Broken Access Control Lab — <span dir="rtl">معمل BAC</span></div>
  <input id="pname" maxlength="20" placeholder="اسمك / Agent name"/>
  <button id="startBtn" class="bp" disabled>⏳ Loading… / جاري التحميل…</button>
  <div class="how"><b>تحكم:</b> WASD / الجويستيك = تحرّك · اسحب الماوس = كاميرا · العجلة = زووم · <b>E</b> = ادخل المعمل المتوهّج.</div>
</div></div>
<div id="hud" class="hud" hidden>
  <div class="top"><div class="bg">🕵️ Pentester</div><div id="obj" class="ob"></div><div id="flag" class="fl">🚩 0/1</div></div>
  <div id="toast" class="tst" hidden></div>
</div>
<div id="touch" class="tc" hidden><div id="joy" class="joy"><div id="kn" class="kn"></div></div><button id="ti" class="ti">E</button></div>
<div id="mr" class="mr" hidden></div>
<canvas id="scene"></canvas>

<script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
<script src="data.js"></script>
<script src="world.js"></script>
<script src="player.js"></script>
<script src="lab.js"></script>
<script src="ui.js"></script>
<script src="main.js"></script>
</body></html>
